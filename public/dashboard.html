<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ripple Creator Dashboard</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 20% 0%, rgba(56, 189, 248, 0.18), transparent 26%),
        radial-gradient(circle at 95% 20%, rgba(37, 99, 235, 0.22), transparent 26%),
        linear-gradient(180deg, #050814, #0d1327);
      color: #f8faff;
      padding: 24px;
    }

    .dashboard {
      max-width: 1120px;
      margin: 0 auto;
    }

    .top {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      margin-bottom: 24px;
    }

    .profile {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .avatar {
  width: 72px;
  height: 72px;
  border-radius: 50%;
  padding: 2px;
  overflow: hidden;
  background: linear-gradient(135deg, #38bdf8, #0ea5e9, #2563eb);
}

    .avatar img {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  object-fit: cover;
  display: block;
}

    h1 {
      margin: 0;
      font-size: clamp(30px, 5vw, 54px);
      letter-spacing: -2px;
    }

    .muted {
      color: #aeb8d6;
      margin: 6px 0 0;
      font-weight: 700;
    }

    .btn {
      border: 0;
      border-radius: 16px;
      padding: 14px 18px;
      font-weight: 900;
      color: white;
      background: linear-gradient(135deg, #38bdf8, #2563eb);
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn.secondary {
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.08);
    }

    .btn:disabled {
      cursor: not-allowed;
      opacity: 0.62;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 16px;
    }

    .card {
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.06);
      border-radius: 28px;
      padding: 22px;
      box-shadow: 0 24px 80px rgba(0,0,0,0.35);
      backdrop-filter: blur(16px);
    }

    .label {
      color: #aeb8d6;
      font-size: 13px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .08em;
    }

    .value {
      font-size: 44px;
      font-weight: 950;
      letter-spacing: -2px;
      margin-top: 12px;
    }

    .small-value {
      margin-top: 14px;
      font-size: 18px;
      font-weight: 850;
      line-height: 1.35;
    }

    .sub {
      margin-top: 8px;
      color: #aeb8d6;
      font-weight: 700;
      font-size: 14px;
    }

    .main {
      display: grid;
      grid-template-columns: 1fr 0.85fr;
      gap: 16px;
    }

    .link-box {
      margin-top: 14px;
      padding: 14px;
      border-radius: 18px;
      background: rgba(0,0,0,0.22);
      border: 1px solid rgba(255,255,255,0.08);
      word-break: break-all;
      color: #dbeafe;
      font-weight: 800;
    }

    .form-control {
      width: 100%;
      margin-top: 10px;
      padding: 14px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(0,0,0,0.25);
      color: white;
      font-weight: 800;
    }

    .form-control:first-child {
      margin-top: 14px;
    }

    .thumbnail-preview {
      width: 100%;
      max-height: 190px;
      display: none;
      margin-top: 10px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.1);
      object-fit: cover;
      background: rgba(0,0,0,0.22);
    }

    .form-error {
      min-height: 18px;
      margin-top: 10px;
      color: #ff9aa8;
      font-size: 13px;
      font-weight: 800;
    }

    .feed {
      display: grid;
      gap: 12px;
      margin-top: 16px;
    }

    .feed-item {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      padding: 14px;
      border-radius: 18px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
    }

    .feed-left strong {
      display: inline-block;
      font-size: 14px;
    }

    .feed-name-line {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .badge-strip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .supporter-badge {
      height: 17px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 6px;
      border-radius: 999px;
      border: 1px solid rgba(255, 224, 132, 0.34);
      background: rgba(255, 224, 132, 0.12);
      color: #ffe8a8;
      font-size: 9px;
      line-height: 1;
      font-weight: 950;
      letter-spacing: 0;
      white-space: nowrap;
    }

    .supporter-badge[data-badge-id="og_wave"] {
      border-color: rgba(96, 200, 255, 0.42);
      background: rgba(56, 189, 248, 0.14);
      color: #bcecff;
    }

    .supporter-badge[data-badge-id="first_drop"] {
      border-color: rgba(93, 236, 174, 0.38);
      background: rgba(53, 224, 161, 0.12);
      color: #bcf8df;
    }

    .supporter-badge[data-badge-id="wave_starter"] {
      border-color: rgba(111, 167, 255, 0.4);
      background: rgba(37, 99, 235, 0.16);
      color: #c8dcff;
    }

    .supporter-badge[data-badge-id="fuel_provider"] {
      border-color: rgba(255, 201, 90, 0.45);
      background: rgba(255, 201, 90, 0.14);
      color: #ffe9ae;
    }

    .supporter-badge[data-badge-id="day_one"] {
      border-color: rgba(255, 126, 202, 0.42);
      background: rgba(255, 126, 202, 0.12);
      color: #ffd1ef;
    }

    .feed-left span {
      display: block;
      margin-top: 4px;
      color: #aeb8d6;
      font-size: 13px;
    }

    .feed-time {
      color: #f8faff;
      font-size: 14px;
      font-weight: 900;
      text-align: right;
      white-space: nowrap;
    }

    .empty {
      color: #aeb8d6;
      font-weight: 700;
      line-height: 1.5;
    }

    .legal-links {
      display: flex;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
      margin-top: 22px;
      color: #aeb8d6;
      font-size: 13px;
      font-weight: 800;
    }

    .legal-links a {
      color: inherit;
      text-decoration: none;
    }

    .legal-links a:hover {
      color: #dbeafe;
      text-decoration: underline;
    }

    @media (max-width: 850px) {
      .grid, .main { grid-template-columns: 1fr; }
      .top { flex-direction: column; align-items: flex-start; }
      .actions { width: 100%; justify-content: flex-start; }
    }
  </style>
</head>

<body>
  <main class="dashboard">
    <section class="top">
      <div class="profile">
        <div class="avatar">
          <img id="creatorImage" src="" alt="">
        </div>

        <div>
          <h1 id="creatorName">Loading...</h1>
          <p class="muted">Private analytics for your Ripple page.</p>
        </div>
      </div>

      <div class="actions">
  <a class="btn" id="supportIslandLink" href="#" target="_blank" rel="noopener">
    Open support island
  </a>

  <button class="btn secondary" id="copyIslandLinkBtn" type="button" onclick="copyPublicLink()">
    Copy island link
  </button>
</div>
    </section>

    <section class="grid">
      <div class="card">
        <div class="label">Total supports</div>
        <div class="value" id="totalSupports">0</div>
      </div>

      <div class="card">
        <div class="label">Estimated earned</div>
        <div class="value" id="estimatedEarned">$0.00</div>
      </div>

      <div class="card">
  <div class="label">Top supported content</div>

  <div id="topVideosList" style="margin-top:16px; display:grid; gap:12px;">
    <p class="empty">No supported content yet.</p>
  </div>
</div>

    
    </section>

    <section class="main">
      <div class="card">
        <div class="label">Recent support</div>

        <div class="feed" id="recentFeed">
          <p class="empty">No recent support yet. When viewers support you, they’ll appear here.</p>
        </div>
      </div>

      <div class="card">
  <div class="label">Create tracked content link</div>

  <input
    id="contentTitle"
    placeholder="Video title"
    class="form-control"
  >

  <input
    id="contentThumbnailFile"
    class="form-control"
    type="file"
    accept="image/jpeg,image/png,image/webp"
  >

  <img id="contentThumbnailPreview" class="thumbnail-preview" alt="">

  <select
    id="contentPlatform"
    class="form-control"
  >
    <option value="tiktok">TikTok</option>
    <option value="youtube">YouTube</option>
    <option value="instagram">Instagram</option>
  </select>

  <button class="btn" id="generateTrackedLinkBtn" style="margin-top:12px;" onclick="createTrackedLink()">
    Generate link
  </button>

  <div class="form-error" id="trackedContentError"></div>
  <div class="link-box" id="trackedLink" style="display:none;"></div>
</div>
    </section>

    <nav class="legal-links" aria-label="Legal links">
      <a href="/privacy">Privacy</a>
      <a href="/terms">Terms</a>
    </nav>
  </main>

  <script>
    let publicLink = "";
let currentProfile = null;
let thumbnailPreviewUrl = "";

function getDashboardDeviceFamily() {
  const timeZone = Intl.DateTimeFormat().resolvedOptions().timeZone;
  return [
    screen.width,
    screen.height,
    screen.colorDepth,
    navigator.platform,
    timeZone
  ].join("|");
}

function escapeHtml(value) {
  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function renderDashboardBadge(badge) {
  if (!badge) return "";

  return `
    <span
      class="supporter-badge"
      data-badge-id="${escapeHtml(badge.id)}"
      title="${escapeHtml(`${badge.label}: ${badge.description || ""}`)}"
    >${escapeHtml(badge.short || badge.label || "Badge")}</span>
  `;
}

function getVisibleDashboardBadges(badges = [], equippedBadge = null) {
  if (equippedBadge?.id) {
    return [equippedBadge];
  }

  return (Array.isArray(badges) ? badges : [])
    .filter(badge => badge?.id && badge.unlocked !== false)
    .slice(0, 1);
}

function renderDashboardBadges(badges = [], equippedBadge = null) {
  const visibleBadges = getVisibleDashboardBadges(badges, equippedBadge);
  if (!visibleBadges.length) return "";

  return `
    <span class="badge-strip">
      ${visibleBadges.map(renderDashboardBadge).join("")}
    </span>
  `;
}

function setTrackedContentError(message = "") {
  const errorEl = document.getElementById("trackedContentError");
  if (errorEl) errorEl.innerText = message;
}

function formatSupportTimestamp(value) {
  const date = new Date(Number(value || 0));

  if (Number.isNaN(date.getTime())) {
    return "";
  }

  return new Intl.DateTimeFormat(undefined, {
    month: "short",
    day: "numeric",
    year: "numeric",
    hour: "numeric",
    minute: "2-digit"
  }).format(date);
}

function readFileAsDataUrl(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result || ""));
    reader.onerror = () => reject(new Error("Could not read thumbnail image."));
    reader.readAsDataURL(file);
  });
}

function loadImage(src) {
  return new Promise((resolve, reject) => {
    const image = new Image();
    image.onload = () => resolve(image);
    image.onerror = () => reject(new Error("Could not load thumbnail image."));
    image.src = src;
  });
}

async function prepareThumbnailUpload(file) {
  if (!file) return "";

  const allowedTypes = new Set(["image/jpeg", "image/png", "image/webp"]);
  if (!allowedTypes.has(file.type)) {
    throw new Error("Upload a JPG, PNG, or WebP thumbnail.");
  }

  if (file.size > 8 * 1024 * 1024) {
    throw new Error("Choose an image under 8 MB.");
  }

  const rawDataUrl = await readFileAsDataUrl(file);
  const image = await loadImage(rawDataUrl);
  const maxSide = 960;
  const scale = Math.min(1, maxSide / Math.max(image.naturalWidth, image.naturalHeight));
  const width = Math.max(1, Math.round(image.naturalWidth * scale));
  const height = Math.max(1, Math.round(image.naturalHeight * scale));
  const canvas = document.createElement("canvas");
  const ctx = canvas.getContext("2d");

  canvas.width = width;
  canvas.height = height;
  ctx.fillStyle = "#0d1327";
  ctx.fillRect(0, 0, width, height);
  ctx.drawImage(image, 0, 0, width, height);

  return canvas.toDataURL("image/jpeg", 0.78);
}

async function uploadTrackedThumbnail(file) {
  if (!file) return "";

  const imageData = await prepareThumbnailUpload(file);
  const res = await fetch("/api/dashboard/thumbnail", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ imageData })
  });
  const data = await res.json();

  if (!data.success) {
    throw new Error(data.message || "Could not upload thumbnail.");
  }

  return data.url || "";
}

function previewTrackedThumbnail() {
  const input = document.getElementById("contentThumbnailFile");
  const preview = document.getElementById("contentThumbnailPreview");
  const file = input?.files?.[0];

  setTrackedContentError("");

  if (thumbnailPreviewUrl) {
    URL.revokeObjectURL(thumbnailPreviewUrl);
    thumbnailPreviewUrl = "";
  }

  if (!file) {
    preview.style.display = "none";
    preview.removeAttribute("src");
    return;
  }

  if (!["image/jpeg", "image/png", "image/webp"].includes(file.type)) {
    input.value = "";
    preview.style.display = "none";
    preview.removeAttribute("src");
    setTrackedContentError("Upload a JPG, PNG, or WebP thumbnail.");
    return;
  }

  thumbnailPreviewUrl = URL.createObjectURL(file);
  preview.src = thumbnailPreviewUrl;
  preview.style.display = "block";
}

function getSupportIslandLink() {
  if (!currentProfile || !currentProfile.slug) {
    alert("Profile not loaded yet.");
    return "";
  }

  return (
    window.location.origin +
    "/island/" +
    encodeURIComponent(currentProfile.slug) +
    "?view=supporter"
  );
}

function openSupportIsland() {
  const link = getSupportIslandLink();
  if (!link) return;

  window.open(link, "_blank");
}

function copySupportIslandLink() {
  const link = getSupportIslandLink();
  if (!link) return;

  navigator.clipboard.writeText(link);
  alert("Island link copied.");
}

    async function loadDashboard() {
  const meRes = await fetch(
    `/api/me?deviceFamily=${encodeURIComponent(getDashboardDeviceFamily())}`
  );
  const profile = await meRes.json();

  currentProfile = profile;

  if (!profile) {
    window.location.href = "/auth/creator";
    return;
  }

  document.getElementById("creatorName").innerText = profile.displayName;
 const img = document.getElementById("creatorImage");

img.src = profile.profileImage || "";

  publicLink = getSupportIslandLink();
  document.getElementById("supportIslandLink").href = publicLink;

  const statsRes = await fetch("/api/dashboard/stats");
  const countData = await statsRes.json();

  const supports = Number(countData.supports || 0);
  const earnings = Number(countData.earnings || 0);

  document.getElementById("totalSupports").innerText = supports;
  document.getElementById("estimatedEarned").innerText = "$" + earnings.toFixed(2);

  if (countData.topVideos && countData.topVideos.length > 0) {
    const list = document.getElementById("topVideosList");

    list.innerHTML = countData.topVideos.map((video, index) => `
      <div class="feed-item">
        <div class="feed-left">
          <strong>#${index + 1} ${video.videoTitle || "Untitled content"}</strong>
          <span>${(video.platform || "unknown").toUpperCase()} • ${video.supports} supports</span>
        </div>

        <div style="font-size:28px;">
          ${index === 0 ? "🥇" : index === 1 ? "🥈" : "🥉"}
        </div>
      </div>
    `).join("");
  }

  if (countData.recentSupports && countData.recentSupports.length > 0) {
    document.getElementById("recentFeed").innerHTML =
      countData.recentSupports.map(item => `
        <div class="feed-item">
          <div class="feed-left">
            <div class="feed-name-line">
              <strong>${escapeHtml(item.name)}</strong>
              ${renderDashboardBadges(item.badges, item.equippedBadge)}
            </div>
            <span>${escapeHtml(item.emoji ? item.emoji : "Support echoed into the well")}</span>
          </div>

          <div class="feed-time">${formatSupportTimestamp(item.time)}</div>
        </div>
      `).join("");
  }
}
   

    function copyPublicLink() {
      navigator.clipboard.writeText(publicLink);
      const button = document.getElementById("copyIslandLinkBtn");
      if (!button) return;

      button.innerText = "Copied";
      setTimeout(() => {
        button.innerText = "Copy island link";
      }, 1200);
    }
    async function createTrackedLink() {
  const title = document.getElementById("contentTitle").value.trim();
  const platform = document.getElementById("contentPlatform").value;
  const thumbnailFile = document.getElementById("contentThumbnailFile").files[0];
  const button = document.getElementById("generateTrackedLinkBtn");

  setTrackedContentError("");

  if (!title) {
    setTrackedContentError("Add a video title first.");
    return;
  }

  let thumbnail = "";

  try {
    button.disabled = true;
    button.innerText = "Generating...";
    thumbnail = await uploadTrackedThumbnail(thumbnailFile);
  } catch (err) {
    setTrackedContentError(err.message || "Could not upload thumbnail.");
    return;
  } finally {
    button.disabled = false;
    button.innerText = "Generate link";
  }

  const videoId =
    platform + "-" + Date.now();

  const linkUrl = new URL(
    "/island/" + encodeURIComponent(currentProfile.slug),
    window.location.origin
  );
  linkUrl.searchParams.set("video", videoId);
  linkUrl.searchParams.set("view", "supporter");
  linkUrl.searchParams.set("title", title);
  linkUrl.searchParams.set("platform", platform);

  if (thumbnail) {
    linkUrl.searchParams.set("thumbnail", thumbnail);
  }

  const link = linkUrl.toString();

  const box = document.getElementById("trackedLink");
  box.innerText = link;
  box.style.display = "block";

  navigator.clipboard.writeText(link).catch(() => {});
}

    document
      .getElementById("contentThumbnailFile")
      .addEventListener("change", previewTrackedThumbnail);

    loadDashboard();
  </script>
  
</body>
</html>
